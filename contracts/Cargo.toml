[package]
name = "neuralnet-contracts"
version = "0.1.0"
edition = "2021"
description = "Smart contracts for the NeuralNet decentralized AI computing marketplace"
authors = ["NeuralNet Team <dev@neuralnet.fit>"]
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "neuralnet_contracts"

[features]
no-entrypoint = []
no-idl = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = "0.28.0"
anchor-spl = "0.28.0"
solana-program = "1.16"
spl-token = { version = "4.0", features = ["no-entrypoint"] }
spl-associated-token-account = { version = "2.0", features = ["no-entrypoint"] }

[dev-dependencies]
solana-program-test = "1.16"
solana-sdk = "1.16" 